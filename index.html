<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="战队火力榜，点进战队帮你加一把火">
<title>战队火力榜 · 哪个战队最猛</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
:root{
  --blue:#1b7ff2;
  --red:#ff4141;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#dbe7f4}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#222}
.page{
  max-width:480px;margin:0 auto;min-height:100vh;
  background:linear-gradient(180deg,#41a3ff 0%,#1b7ff2 45%,#1263cf 100%);
  padding:12px 12px 46px;
  box-shadow:0 0 44px rgba(0,0,0,.22);
}
/* 微信内提示 */
.wxbar{display:flex;align-items:center;gap:8px;background:#fff7d6;color:#8a5a00;font-size:12.5px;line-height:1.5;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.wxbar b{flex:1;font-weight:500}
.wxbar .x{cursor:pointer;font-size:14px;opacity:.6;padding:2px 6px}
/* 顶部标语横幅 */
.banner{border-radius:10px;text-align:center;font-weight:800;letter-spacing:.5px;box-shadow:0 3px 10px rgba(0,50,120,.18)}
.banner-1{background:#1f8bff;border:2px solid rgba(255,255,255,.7);color:#ffe600;font-size:17px;padding:10px 8px}
.banner-2{margin-top:10px;background:#1f8bff;border:2px solid rgba(255,255,255,.7);color:#fff;font-size:15.5px;padding:9px 8px;font-weight:600}
.banner-2 mark{background:#ffe600;color:#111;padding:1px 5px;border-radius:4px;font-weight:800}
.update{color:rgba(255,255,255,.85);font-size:12px;text-align:center;margin:12px 0}
/* 分组容器 */
.group{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:10px}
.group-head{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.g-1{background:#fff;color:#1b7ff2;font-weight:900;font-size:18px;padding:8px 18px;border-radius:10px;letter-spacing:1px;box-shadow:0 3px 8px rgba(0,40,100,.18)}
.g-2{background:#ffe600;color:#e63030;font-weight:800;font-size:14px;padding:5px 12px;border-radius:8px}
/* 战队卡片 */
.item{
  display:flex;gap:11px;background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;
  box-shadow:0 4px 14px rgba(0,60,150,.16);text-decoration:none;color:inherit;position:relative;
  animation:up .45s both;
}
.item:last-child{margin-bottom:2px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 品牌区 */
.brand{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.corner{
  background:linear-gradient(180deg,#ffe94d,#ffce00);color:#7a5500;font-size:11px;font-weight:900;
  padding:2px 9px;border-radius:5px 5px 5px 0;letter-spacing:.5px;align-self:flex-start;
  box-shadow:0 2px 0 rgba(180,120,0,.35);transform:translateX(-3px);
}
.brand-logo{
  width:56px;height:56px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;color:#fff;
  box-shadow:0 3px 8px rgba(0,40,100,.18);position:relative;overflow:hidden;
}
.brand-logo::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.45),transparent 55%);
}
.brand-logo .glyph{font-size:22px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.brand-logo .abbr{font-size:11.5px;font-weight:900;letter-spacing:.3px;line-height:1;position:relative;z-index:1}
/* 内容区 */
.body{flex:1;min-width:0;padding-top:2px}
.title-row{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.team-name{font-size:15.5px;font-weight:800;line-height:1.4;color:#111}
.people{
  display:inline-flex;align-items:center;gap:2px;background:#fff3b8;color:#a06e00;
  font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:5px;white-space:nowrap;margin-top:2px;
}
.people::before{content:"👤";font-size:10px}
.draw{font-size:12.5px;color:#999;margin:5px 0 8px}
/* 数据条 */
.meter{display:flex;border-radius:7px;overflow:hidden;margin-bottom:9px;width:100%}
.power{display:flex;align-items:center;gap:4px;background:#fff8dc;padding:5px 9px;font-size:12px;color:#8a6200;white-space:nowrap}
.power b{font-size:13.5px;font-weight:900;color:#111;margin:0 1px}
.money{flex:1;display:flex;align-items:center;background:#fff0a8;padding:5px 9px;font-size:12px;color:#8a6200;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money b{font-weight:900;color:#e04400;font-size:12.5px;margin:0 2px}
/* 按钮 */
.go{
  display:flex;align-items:center;justify-content:center;gap:4px;width:100%;
  background:linear-gradient(180deg,#ffe94d,#ffce00);color:#222;font-weight:800;font-size:13.5px;
  padding:8px;border-radius:999px;box-shadow:0 2px 0 rgba(180,120,0,.35);
}
.go.empty{background:#ececec;color:#999;box-shadow:0 2px 0 #d0d0d0}
/* 提示 */
.tips{background:rgba(255,255,255,.95);border-radius:12px;padding:12px;text-align:center;margin:16px 0;box-shadow:0 4px 14px rgba(0,60,150,.16)}
.tips-title{color:#ff2d2d;font-weight:900;font-size:16px;letter-spacing:1px;border-bottom:2px solid #ff2d2d;display:inline-block;padding-bottom:2px;margin-bottom:8px}
.tips-body{font-weight:900;font-size:16.5px;color:#111}
.tips-body em{color:#ff2d2d;font-style:normal;font-size:20px;padding:0 2px}
.tips-sub{font-size:11.5px;color:#888;margin-top:6px}
.disclaimer{color:rgba(255,255,255,.75);font-size:11px;line-height:1.7;text-align:center;margin-top:18px;padding:0 6px}
/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.78);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="page">

  <div class="wxbar" id="wxbar">
    <b>💡 如点击无反应，请点右上角「···」选择「在浏览器打开」</b>
    <span class="x" onclick="document.getElementById('wxbar').remove()">✕</span>
  </div>

  <div class="banner banner-1">哪个战队最猛，一起加把火！</div>
  <div class="banner banner-2">每个战队都点一遍，<mark>火力值叠加才够猛</mark></div>
  <div class="update">🔥 实时火力榜 · <span id="today"></span></div>

  <div class="group">
    <div class="group-head">
      <div class="g-1">以下是品牌战队，火力全开</div>
      <div class="g-2">点进去帮战队加一把火</div>
    </div>
    <div id="list"></div>
  </div>

  <div class="tips">
    <div class="tips-title">💥 温馨提示：</div>
    <div class="tips-body">3个战队<em>全部</em>点一遍 ↑</div>
    <div class="tips-sub">火力值与瓜分金额以各品牌官方活动页面为准</div>
  </div>

  <p class="disclaimer">本页面为活动助力信息分享页，活动规则与奖励以各品牌官方页面为准。<br>助力过程请勿向任何人透露短信验证码等隐私信息。</p>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================================================
   ✏️ 只需改这里：每个战队粘上你自己的专属助力链接
   url:"" 留空 = 该战队按钮显示"暂未开启"
   ==================================================== */
const TEAMS = [
  { tag:"超燃", brand:"TCL",    abbr:"TCL",    glyph:"⚡", color:"linear-gradient(135deg,#ff5b5b,#d61b1b)",
    name:"TCL宅家潮玩战队",        people:7128, draw:"抽TCL电视",            power:"73.5W", money:"128000元现金", url:"" },

  { tag:"劲猛", brand:"冷酸灵", abbr:"冷酸灵", glyph:"🦷", color:"linear-gradient(135deg,#5ac8fa,#1b7ff2)",
    name:"冷酸灵x黄子弘凡自在队",  people:4180, draw:"抽黄子弘凡周边",       power:"42.2W", money:"92000元现金",  url:"" },

  { tag:"雄厚", brand:"奥佳华", abbr:"OGAWA", glyph:"💆", color:"linear-gradient(135deg,#8fd14f,#3a9e2e)",
    name:"奥佳华x彭于晏燃动战队", people:3319,  draw:"抽彭于晏亲签照",       power:"27W",   money:"53000元现金",  url:"" },
];

/* ---------- 以下无需修改 ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function render(){
  document.getElementById("list").innerHTML = TEAMS.map((t,i) => {
    const has = t.url && t.url.trim() && t.url.trim() !== "#";
    return `
    <a class="item" href="${has ? esc(t.url.trim()) : "javascript:void(0)"}"
       ${has ? "" : 'data-empty="1"'} data-name="${esc(t.name)}"
       style="animation-delay:${i*0.06}s">
      <div class="brand">
        <div class="corner">${esc(t.tag)}</div>
        <div class="brand-logo" style="background:${esc(t.color)}">
          <span class="glyph">${esc(t.glyph)}</span>
          <span class="abbr">${esc(t.abbr)}</span>
        </div>
      </div>
      <div class="body">
        <div class="title-row">
          <span class="team-name">${esc(t.name)}</span>
          <span class="people">${t.people.toLocaleString()}</span>
        </div>
        <div class="draw">${esc(t.draw)}</div>
        <div class="meter">
          <span class="power">🔥 <b>${esc(t.power)}</b> 火力值</span>
          <span class="money">可瓜分<b>${esc(t.money)}</b></span>
        </div>
        <span class="go ${has ? "" : "empty"}">${has ? "🔥 去加入战队一起瓜分" : "暂未开启"}</span>
      </div>
    </a>`;
  }).join("");
}
render();

const d = new Date();
document.getElementById("today").textContent = `${d.getMonth()+1}月${d.getDate()}日`;

let timer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(timer); timer = setTimeout(()=>el.classList.remove("show"), 2000);
}
document.addEventListener("click", e => {
  const card = e.target.closest('.item[data-empty="1"]');
  if (card){ e.preventDefault(); toast("「" + card.dataset.name + "」链接还未配置"); }
});
</script>
</body>
</html>
