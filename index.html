<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战队火力榜 · 哪个战队最猛</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#2f87ea 0%,#3d97f2 50%,#2f87ea 100%);
    min-height:100vh;padding:0 0 30px;
  }
  .wrap{max-width:460px;margin:0 auto;padding:0 13px}

  /* 顶部两条横幅 */
  .banner{
    border:1.5px solid rgba(255,255,255,.55);border-radius:10px;
    padding:11px 10px;text-align:center;margin-bottom:11px;
    background:rgba(255,255,255,.08);
  }
  .banner .l1{color:#ffe14d;font-size:18px;font-weight:800;letter-spacing:.5px}
  .banner .l2{color:#fff;font-size:14.5px;font-weight:600}
  .banner .hl{background:#ffe14d;color:#1a5fd0;padding:1px 6px;border-radius:4px;font-weight:800}

  .meta{text-align:center;color:rgba(255,255,255,.85);font-size:13px;margin:14px 0}
  .meta .dot{margin-right:4px}

  /* 区块标题 */
  .list-box{
    background:rgba(255,255,255,.14);border-radius:16px;padding:14px 11px;
  }
  .sec-head{text-align:center;margin-bottom:13px}
  .sec-pill{
    display:inline-block;background:#fff;color:#1a5fd0;font-size:18px;font-weight:800;
    padding:8px 24px;border-radius:22px;box-shadow:0 4px 10px rgba(10,50,120,.2);
  }
  .sec-tip{
    display:block;margin:11px auto 0;width:fit-content;
    background:#ffe14d;color:#7a4a00;font-size:13.5px;font-weight:700;
    padding:7px 16px;border-radius:6px;
  }

  /* 券式卡片：一行一条 */
  .item{
    background:#fff;border-radius:14px;
    padding:12px 12px;margin-bottom:11px;
    display:flex;align-items:center;gap:11px;
    box-shadow:0 4px 10px rgba(10,50,120,.18);
  }
  .item:last-child{margin-bottom:2px}
  .ico{
    width:50px;height:50px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;line-height:1;
  }
  .ico.orange{background:linear-gradient(160deg,#ffb347,#ff8c2e)}
  .ico.pink{background:linear-gradient(160deg,#f78fb8,#ee5f9a)}
  .ico.sky{background:linear-gradient(160deg,#7ecbfa,#3da4e8)}
  .ico.red{background:linear-gradient(160deg,#ff7a6b,#f04438)}
  .ico.green{background:linear-gradient(160deg,#5fd08a,#2fae62)}
  .txt{flex:1;min-width:0}
  .t1{font-size:16px;font-weight:800;color:#1a1a1a;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:13px;font-weight:700;color:#f04438;margin-top:4px}
  .btn{
    flex-shrink:0;
    background:linear-gradient(180deg,#ffe14d,#ffc400);
    color:#7a4300;font-size:14.5px;font-weight:800;
    border:none;border-radius:20px;padding:9px 16px;
    box-shadow:0 3px 8px rgba(200,140,0,.28);
    cursor:pointer;font-family:inherit;letter-spacing:.3px;
    transition:transform .12s ease;
  }
  .btn:active{transform:scale(.96)}

  /* 温馨提示 */
  .tips{
    background:rgba(255,255,255,.14);border-radius:16px;
    padding:14px 16px 16px;margin-top:14px;
  }
  .tips .tt{text-align:center;color:#ffe14d;font-size:15.5px;font-weight:800;margin-bottom:10px}
  .tips p{color:rgba(255,255,255,.88);font-size:13px;line-height:1.8}

  .footer{text-align:center;color:rgba(255,255,255,.5);font-size:11.5px;margin-top:18px}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:99}
  .mask.on{display:flex}
  .dialog{background:#fff;border-radius:16px;padding:22px 18px 16px;width:100%;max-width:300px;text-align:center}
  .dialog .dtitle{font-size:16.5px;font-weight:800;color:#1a1a1a}
  .dialog .dteam{font-size:13.5px;color:#888;margin-top:9px;line-height:1.6;white-space:pre-line}
  .dialog .dbtn{margin-top:18px;width:100%;padding:10px 0;border:none;border-radius:20px;
    background:linear-gradient(180deg,#ffe14d,#ffc400);color:#7a4300;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <div class="banner" style="margin-top:14px">
    <div class="l1">哪个战队最猛，一起加把火！</div>
  </div>

  <div class="banner">
    <div class="l2">每个战队都点一遍，<span class="hl">火力值叠加才够猛</span></div>
  </div>

  <div class="meta"><span class="dot">🔥</span>实时火力榜 · 今日已更新 · <span id="today"></span></div>

  <div class="list-box">
    <div class="sec-head">
      <div class="sec-pill">以下是品牌战队，火力全开</div>
      <span class="sec-tip">点按钮帮战队加一把火</span>
    </div>
    <div id="list"></div>
  </div>

  <div class="tips">
    <div class="tt">👑 温馨提示 ·</div>
    <p>· 火力值实时更新，以页面显示为准<br>
       · 每个战队都可以点一遍，火力值会叠加<br>
       · 可瓜分现金按最终火力占比分配<br>
       · 活动最终解释权归主办方所有</p>
  </div>

  <div class="footer">战队火力榜 · daylume.github.io</div>
</div>

<div class="mask" id="mask">
  <div class="dialog">
    <div class="dtitle">加入成功，火力值 +1 🔥</div>
    <div class="dteam" id="dteam"></div>
    <button class="dbtn" id="dclose">知道了</button>
  </div>
</div>

<script>
/* ==================================================================
   ★★★ 只改这一段就行 ★★★

   每个战队 5 个字段：
   ico      —— 图标 emoji，比如 "🔥" "🦷" "⚡"
   icoClass —— 图标底色：orange / pink / sky / red / green
   name     —— 战队名称（白色卡片第一行大字）
   sub      —— 红色小字，奖品、火力值、金额写这里
   link     —— ★你的邀请链接★ 直接粘贴在引号里，点击按钮就跳转

   ⚠️ 链接一定要用英文双引号包起来，例：
   link:"https://xxx.com/invite?code=abc"
   ================================================================== */
const TEAMS = [
  {
    ico:"🔥", icoClass:"orange",
    name:"奥佳华x彭于晏燃动战队",
    sub:"每天可领 · 抽彭于晏亲签照 · 71.5W火力 · 可瓜分50000元现金",
    link:""     // ← 把奥佳华战队的邀请链接填这里
  },
  {
    ico:"🦷", icoClass:"sky",
    name:"冷酸灵x黄子弘凡自在队",
    sub:"每天可领 · 抽黄子弘凡周边 · 63.2W火力 · 可瓜分40000元现金",
    link:""     // ← 把冷酸灵战队的邀请链接填这里
  },
  {
    ico:"⚡", icoClass:"red",
    name:"TCL宅家潮玩战队",
    sub:"每天可领 · 抽TCL电视 · 95.9W火力 · 可瓜分80000元现金",
    link:""     // ← 把 TCL 战队的邀请链接填这里
  }
];
/* ================================================================== */

const list = document.getElementById('list');
TEAMS.forEach((t, i) => {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = `
    <div class="ico ${t.icoClass}">${t.ico}</div>
    <div class="txt">
      <div class="t1">${t.name}</div>
      <div class="t2">${t.sub}</div>
    </div>
    <button class="btn" data-idx="${i}">🔥立即加火</button>
  `;
  list.appendChild(d);
});

const d = new Date();
document.getElementById('today').textContent = `${d.getMonth()+1}月${d.getDate()}日`;

const mask = document.getElementById('mask');
const dteam = document.getElementById('dteam');
list.addEventListener('click', e => {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const t = TEAMS[btn.dataset.idx];

  // 填了邀请链接 → 直接跳转
  if (t.link && t.link.trim() !== '') {
    window.location.href = t.link.trim();
    return;
  }

  // 没填链接 → 弹提示（提醒你还没配置）
  dteam.textContent = `「${t.name}」\n还没配置邀请链接，请在代码里填 link 字段`;
  mask.classList.add('on');
});
document.getElementById('dclose').onclick = () => mask.classList.remove('on');
mask.onclick = e => { if (e.target === mask) mask.classList.remove('on'); };
</script>
</body>
</html>
